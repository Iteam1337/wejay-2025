name: Build and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run linting
      run: npm run lint

    - name: Build application
      run: npm run build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push Docker image
      id: build
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  update-manifest:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Patch r8s to make App host optional
      run: |
        # Patch @r8s/recipes dist to skip Endpoint creation when App has no host.
        # Temporary until @r8s/recipes@0.1.1 is published with this fix.
        APP_JS="node_modules/@r8s/recipes/dist/app.js"
        node -e "
          const fs = require('fs');
          const file = '$APP_JS';
          let code = fs.readFileSync(file, 'utf8');
          // The published code unconditionally pushes jsx(Endpoint, {...}).
          // Wrap it in: if (host) { ... }
          // Match: elements.push((0, core_1.jsx)(endpoint_1.Endpoint, {
          //   ... ends with: }));
          const re = /elements\.push\(\(0, core_1\.jsx\)\(endpoint_1\.Endpoint,\s*\{[\s\S]*?\}\)\);/;
          if (re.test(code)) {
            code = code.replace(re, 'if (host) { $& }');
            fs.writeFileSync(file, code);
            console.log('Patched app.js: Endpoint creation is now conditional on host');
          } else {
            console.log('app.js already patched or pattern not found');
          }
        "

    - name: Render K8s manifests with image tag
      run: npm run k8s:render
      env:
        IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag || github.sha }}

    - name: Validate K8s manifests
      run: npm run k8s:validate

    - name: Commit and push if changed
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        git add k8s/manifest.yaml
        if git diff --staged --quiet; then
          echo "No changes to manifest.yaml"
        else
          git commit -m "chore: Update k8s manifest with image tag ${{ needs.build-and-push.outputs.image_tag }}"
          git push
        fi