apiVersion: v1
kind: Namespace
metadata:
  name: wejay
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-client
  namespace: wejay
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-auth
  namespace: wejay
spec:
  vaultConnectionRef: vault-secrets-operator-system/default
  method: kubernetes
  mount: kubernetes-berget-dmz
  kubernetes:
    role: wejay
    serviceAccount: vault-client
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: wejay-secret
  namespace: wejay
spec:
  vaultAuthRef: vault-auth
  mount: secret
  type: kv-v2
  path: wejay/app
  refreshAfter: 60s
  destination:
    create: true
    name: wejay-secret
  rolloutRestartTargets:
    - kind: Deployment
      name: wejay
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisCluster
metadata:
  name: wejay-cache
  namespace: wejay
spec:
  clusterSize: 1
  persistenceEnabled: false
  kubernetesConfig:
    image: redis:7.2-alpine
    imagePullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wejay-tls
  namespace: wejay
spec:
  secretName: wejay-tls
  dnsNames:
    - wejay.dmz.berget.ai
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wejay-endpoint-route
  namespace: wejay
  annotations:
    external-dns.alpha.kubernetes.io/hostname: wejay.dmz.berget.ai
spec:
  parentRefs:
    - name: dmz-shared-gateway
      namespace: envoy-gateway-system
  hostnames:
    - wejay.dmz.berget.ai
  rules:
    - backendRefs:
        - name: wejay
          port: 80
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: wejay-websocket
  namespace: wejay
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: wejay-endpoint-route
  timeout:
    http:
      requestTimeout: 0s
  connection:
    bufferLimit: 10485760
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wejay
  namespace: wejay
  labels:
    app: wejay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wejay
  template:
    metadata:
      labels:
        app: wejay
    spec:
      containers:
        - name: app
          image: ghcr.io/iteam1337/wejay-2025:1.0.0
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: REDIS_URL
              value: redis://wejay-cache-leader.wejay.svc.cluster.local:6379
            - name: VITE_SPOTIFY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: wejay-secret
                  key: spotify-client-id
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wejay-secret
                  key: spotify-client-secret
            - name: BERGET_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wejay-secret
                  key: berget-api-key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: wejay
  namespace: wejay
spec:
  type: ClusterIP
  selector:
    app: wejay
  ports:
    - port: 80
      targetPort: 8080
