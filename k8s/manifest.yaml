apiVersion: v1
kind: Namespace
metadata:
  name: wejay
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-client
  namespace: wejay
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-auth
  namespace: wejay
spec:
  vaultConnectionRef: vault-secrets-operator-system/default
  method: kubernetes
  mount: kubernetes-berget-dmz
  kubernetes:
    role: wejay
    serviceAccount: vault-client
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: wejay-secret
  namespace: wejay
spec:
  vaultAuthRef: vault-auth
  mount: secret
  type: kv-v2
  path: wejay/app
  refreshAfter: 60s
  destination:
    create: true
    name: wejay-secret
  rolloutRestartTargets:
    - kind: Deployment
      name: wejay
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wejay
  namespace: wejay
  labels:
    app: wejay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wejay
  template:
    metadata:
      labels:
        app: wejay
    spec:
      containers:
        - name: app
          image: ghcr.io/iteam1337/wejay-2025:main
          ports:
            - containerPort: 8080
          env:
            - name: NODE_ENV
              value: production
            - name: VITE_SPOTIFY_REDIRECT_URI
              value: https://wejay.dmz.berget.ai/callback
            - name: REDIS_URL
              value: redis://wejay-cache.wejay.svc.cluster.local:6379
            - name: VITE_SPOTIFY_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: wejay-secret
                  key: spotify-client-id
            - name: CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: wejay-secret
                  key: spotify-client-secret
            - name: BERGET_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wejay-secret
                  key: berget-api-key
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: wejay
  namespace: wejay
spec:
  type: ClusterIP
  selector:
    app: wejay
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wejay-endpoint
  namespace: wejay
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    external-dns.alpha.kubernetes.io/hostname: wejay.dmz.berget.ai
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  rules:
    - host: wejay.dmz.berget.ai
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wejay
                port:
                  number: 80
  tls:
    - hosts:
        - wejay.dmz.berget.ai
      secretName: wejay-tls
---
apiVersion: redis.redis.opstreelabs.in/v1beta2
kind: RedisCluster
metadata:
  name: wejay-cache
  namespace: wejay
spec:
  clusterSize: 3
  kubernetesConfig:
    image: redis:7.2-alpine
  storage:
    volumeClaimTemplate:
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
